# The source SoundFonts the eval pianos are cut from. `build.py` downloads each,
# checks both checksums, and writes a derived SoundFont with a known envelope.
#
# The sources are not committed (30 and 148 MB); they download to
# target/soundfont-sources/. The derived SoundFonts are small and are committed
# beside this file, so the tests need neither the sources nor numpy. Both
# licences allow redistributing a modified file. `derived_sha256` is what the
# build must produce, so a change to the build or the envelope shows as a diff.

# The tuning set's piano. Its piano samples are short loops.
