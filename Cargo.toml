[package]
name = "melody-visualizer"
version = "0.1.0"
authors = ["Jim Posen <jim.posen@gmail.com>"]
edition = "2024"

[workspace]
members = ["xtask"]

[lib]
# `cdylib` is the CLAP plugin; `lib` lets `main.rs` build the standalone app.
crate-type = ["cdylib", "lib"]

[features]
# Exposes `test_support` to dependents. The self dev-dependency below turns it
# on for this crate's own test and bench targets, so `tests/` can use the
# fixtures without any extra flag on the command line.
testing = []

[dependencies]
derive_more = { version = "2", features = ["display", "from", "error"] }
futures = "0.3.5"
futures-timer = "3.0.2"
log = "0.4.8"
# `assert_process_allocs` panics in debug builds if `process()` allocates.
nice-plug = { version = "0.4.2", features = ["assert_process_allocs", "standalone"] }
nice-plug-iced = { version = "0.5.0", features = ["image", "canvas"] }
palette = "0.7"
parking_lot = "0.12"
realfft = "3"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
tracing-log = { version = "0.2", default-features = false, features = ["log-tracer"] }

[dev-dependencies]
melody-visualizer = { path = ".", features = ["testing"] }
# Only the harness. The plotting and HTML report features pull a large tree and
# the benchmarks report their numbers in the terminal.
criterion = { version = "0.8", default-features = false, features = [
	"cargo_bench_support",
] }
rand = "0.10"

# The spiral's pixel loop is plain Rust, which runs an order of magnitude slower
# unoptimised, and `tests/render_budget.rs` times it in the profile the tests
# build in. The `test` profile inherits this one.
[profile.dev]
opt-level = 1

[[bench]]
name = "dsp"
harness = false

[[bench]]
name = "graphic"
harness = false
