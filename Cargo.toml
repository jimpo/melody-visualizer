[package]
name = "melody-visualizer"
version = "0.1.0"
authors = ["Jim Posen <jim.posen@gmail.com>"]
edition = "2024"

[dependencies]
# GTK 4 stack. The standalone glib/gio/cairo versions are pinned to the same
# generation gtk4 0.11 pulls so only one copy of each links (gdk = gdk4).
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
gdk = { package = "gdk4", version = "0.11" }
glib = "0.22"
gio = "0.22"
cairo = { package = "cairo-rs", version = "0.22" }
derive_more = { version = "2", features = ["display", "from", "error"] }
jack = "0.13"
env_logger = "0.11"
futures = "0.3.5"
futures-timer = "3.0.2"
itertools = "0.14"
log = "0.4.8"
palette = "0.7"
rustfft = "6"
async-channel = "2.5.0"

[features]
# Exposes `test_support` to dependents. The self dev-dependency below turns it
# on for this crate's own test and bench targets, so `tests/` can use the
# fixtures without any extra flag on the command line.
testing = []

[dev-dependencies]
melody-visualizer = { path = ".", features = ["testing"] }
# Only the harness. The plotting and HTML report features pull a large tree and
# the benchmarks report their numbers in the terminal.
criterion = { version = "0.8", default-features = false, features = [
	"cargo_bench_support",
] }
rand = "0.10"

[[bench]]
name = "dsp"
harness = false

[[bench]]
name = "graphic"
harness = false
