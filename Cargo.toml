[package]
name = "melody-visualizer"
version = "0.1.0"
authors = ["Jim Posen <jim.posen@gmail.com>"]
edition = "2018"

[dependencies]
cairo = { package = "cairo-rs", version = "0.9.0" }
derive_more = { version = "2", features = ["display", "from", "error"] }
jack = "0.6.2"
env_logger = "0.11"
futures = "0.3.5"
futures-timer = "3.0.2"
itertools = "0.14"
log = "0.4.8"
gio = "0.9.0"
glib = "0.10.1"
gdk = "0.13.0"
gtk = "0.9.1"
palette = "0.7"
rustfft = "6"

[dev-dependencies]
rand = "0.10"